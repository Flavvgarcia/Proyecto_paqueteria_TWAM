# ---------------------------------------------------------------------------
# DNS dinámico: Docker tiene su propio DNS en 127.0.0.11. nginx le vuelve a
# preguntar la IP de cada servicio cada 10 s. Antes la IP se guardaba UNA vez al
# arrancar, y al reconstruir un servicio (IP nueva) el gateway se quedaba con la
# vieja ("no responde" hasta hacer docker compose restart gateway).
# Para que nginx use el resolver, el destino va en una VARIABLE (ver "set" abajo).
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# ID de petición: si el cliente manda un X-Request-ID limpio, se respeta;
# si no, nginx genera uno ($request_id: 32 caracteres hexadecimales).
# ---------------------------------------------------------------------------
map $http_x_request_id $id_peticion {
    "~^[A-Za-z0-9-]{1,64}$" $http_x_request_id;
    default                 $request_id;
}

# ---------------------------------------------------------------------------
# Límite de intentos de operador (contra adivinar la clave a fuerza bruta):
# cambiar estado: 30 por minuto por IP; comprobar la clave (/operador): 10 por minuto.
# Solo cuentan esas dos cosas;
# crear pedidos y el seguimiento no se limitan (key vacía = no se cuenta).
# ---------------------------------------------------------------------------
map $request_method $ip_si_es_patch {
    PATCH   $binary_remote_addr;
    default "";
}
limit_req_zone $ip_si_es_patch    zone=estados:1m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=operador:1m rate=10r/m;
limit_req_status 429;   # 429 Too Many Requests

# ---------------------------------------------------------------------------
# CORS: permite que un front servido desde OTRO origen (otro puerto, p. ej. un
# Vite en localhost:5173) llame a esta API. El navegador lo exige: si la respuesta
# no trae Access-Control-Allow-Origin, bloquea la petición.
# Solo se aceptan los orígenes de esta lista; para agregar uno (p. ej. la compu de
# un compañero en la red), añade una línea con su origen exacto.
# Si el origen no está, la variable queda vacía y nginx NO pone los encabezados.
# ---------------------------------------------------------------------------
map $http_origin $cors_origen {
    "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$"  $http_origin;   # cualquier puerto local
    # "http://192.168.1.50:5173"                       $http_origin;   # ejemplo: otra compu
    default                                            "";
}
# El resto de encabezados CORS solo se mandan si el origen está permitido.
map $cors_origen $cors_metodos     { "" ""; default "GET, POST, PATCH, OPTIONS"; }
map $cors_origen $cors_encabezados { "" ""; default "Content-Type, Authorization, Idempotency-Key, X-Request-ID"; }
map $cors_origen $cors_expuestos   { "" ""; default "X-Request-ID"; }

# El log del gateway también lleva el ID.
log_format con_id '$remote_addr [$time_local] "$request" $status id=$id_peticion';

server {
    listen 80;
    access_log /var/log/nginx/access.log con_id;

    # Destinos (nombre del servicio en Compose + puerto)
    set $pedidos    pedidos:8001;
    set $recomendar recomendar:8002;
    set $rutas      rutas:8003;
    set $clima      clima:8004;
    set $flota      flota:8005;

    # Para TODAS las rutas que pasan a un servicio (las locations las heredan):
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $id_peticion;   # el servicio recibe el ID
    add_header X-Request-ID $id_peticion always;  # y el navegador también lo ve
    proxy_hide_header X-Request-ID;               # (el del servicio es el mismo: no repetirlo)

    # CORS (ver los "map" de arriba). Un valor vacío = nginx no manda ese encabezado.
    add_header Access-Control-Allow-Origin   $cors_origen always;
    add_header Access-Control-Allow-Methods  $cors_metodos always;
    add_header Access-Control-Allow-Headers  $cors_encabezados always;
    add_header Access-Control-Expose-Headers $cors_expuestos always;  # que el JS pueda leer X-Request-ID
    add_header Access-Control-Max-Age        600 always;              # el navegador recuerda el permiso 10 min
    add_header Vary Origin always;   # la respuesta cambia según el origen (para cachés)

    # "Preflight": antes de un PATCH, o de un POST con JSON o con Authorization, el
    # navegador pregunta con OPTIONS si puede. Se contesta aquí mismo (204, sin cuerpo)
    # con los encabezados de arriba; no hace falta molestar a ningún servicio.
    if ($request_method = OPTIONS) {
        return 204;
    }

    # 1) El front: archivos estáticos (index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 2) La API de pedidos (sin ruta después del puerto: se pasa la URL tal cual,
    #    p. ej. /pedidos/A1B2C3D4)
    location /pedidos {
        limit_req zone=estados burst=10 nodelay;  # solo afecta a los PATCH
        proxy_pass http://$pedidos;
    }

    # 2b) Comprobar la clave de operador (modo operador de la página)
    location = /operador {
        limit_req zone=operador burst=5 nodelay;
        proxy_pass http://$pedidos/operador;
    }

    # 3) Salud de cada servicio: el gateway quita el prefijo
    location = /salud/pedidos {
        proxy_pass http://$pedidos/salud;
    }

    location = /salud/recomendar {
        proxy_pass http://$recomendar/salud;
    }

    location = /salud/rutas {
        proxy_pass http://$rutas/salud;
    }

    location = /salud/clima {
        proxy_pass http://$clima/salud;
    }

    location = /salud/flota {
        proxy_pass http://$flota/salud;
    }

    # 2c) Inventario de la flota: SOLO lectura. Apartar y liberar vehículos solo lo hace
    #     pedidos por la red interna; desde afuera no se puede.
    location = /flota {
        limit_except GET { deny all; }
        proxy_pass http://$flota/vehiculos;
    }

    # 4) (Opcional) para depurar: POST /sugerir directo a recomendar
    location = /sugerir {
        proxy_pass http://$recomendar/sugerir;
    }

    # 5) (Opcional) para depurar: POST /plan directo a rutas
    location = /plan {
        proxy_pass http://$rutas/plan;
    }

    # 6) (Opcional) para depurar: GET /clima?hora=15 directo al servicio clima
    #    (sin ruta después del puerto: pasa la URL tal cual, con su ?hora=...)
    location = /clima {
        proxy_pass http://$clima;
    }
}
