upstream pedidos {
    server pedidos:8001;
}

upstream recomendar {
    server recomendar:8002;
}

server {
    listen 80;

    # 1) El front: archivos estáticos (index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 2) La API de pedidos
    location /pedidos {
        proxy_pass http://pedidos;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3) Salud de cada servicio: el gateway quita el prefijo
    location = /salud/pedidos {
        proxy_pass http://pedidos/salud;
    }

    location = /salud/recomendar {
        proxy_pass http://recomendar/salud;
    }

    # 4) (Opcional) para depurar: POST /sugerir directo a recomendar
    location = /sugerir {
        proxy_pass http://recomendar/sugerir;
    }
}