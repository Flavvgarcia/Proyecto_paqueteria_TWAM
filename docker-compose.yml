services:
  recomendar:
    build: ./recomendar
    # sin "ports": solo se alcanza desde la red interna de Compose
  rutas:
    build: ./rutas
    environment:
      # Se leen del archivo .env (que NO se sube a Git)
      ORS_API_KEY: ${ORS_API_KEY:-}
      ALMACEN_LAT: ${ALMACEN_LAT:-}
      ALMACEN_LNG: ${ALMACEN_LNG:-}

  db-pedidos:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    volumes:
      - datos-pedidos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 2s
      retries: 30

  pedidos:
    build: ./pedidos
    environment:
      RECOMENDAR_URL: http://recomendar:8002
      RUTAS_URL: http://rutas:8003
      POSTGRES_HOST: db-pedidos
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    depends_on:
      rutas:
        condition: service_started
      recomendar:
        condition: service_started
      db-pedidos:
        condition: service_healthy
    restart: on-failure

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"          # la ÚNICA puerta hacia afuera
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - pedidos
      - recomendar

volumes:
  datos-pedidos: