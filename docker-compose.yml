services:
  recomendar:
    build: ./recomendar
    # sin "ports": solo se alcanza desde la red interna de Compose
  rutas:
    build: ./rutas
    environment:
      # Se leen del archivo .env (que NO se sube a Git)
      ORS_API_KEY: ${ORS_API_KEY:-}
      ALMACEN_LAT: ${ALMACEN_LAT:-}
      ALMACEN_LNG: ${ALMACEN_LNG:-}

  clima:
    build: ./clima
    environment:
      # Open-Meteo no necesita clave. El almacén se usa si un pedido no trae destino.
      ALMACEN_LAT: ${ALMACEN_LAT:-}
      ALMACEN_LNG: ${ALMACEN_LNG:-}

  db-pedidos:
    image: postgres:16-alpine
    environment:
      # Del .env. ":?" = si falta la contraseña, Compose se niega a arrancar (con este mensaje).
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
      POSTGRES_USER: ${POSTGRES_USER:-pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - datos-pedidos:/var/lib/postgresql/data
    healthcheck:
      # $$ = un "$" que lee el contenedor (no Compose)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  pedidos:
    build: ./pedidos
    environment:
      RECOMENDAR_URL: http://recomendar:8002
      RUTAS_URL: http://rutas:8003
      CLIMA_URL: http://clima:8004
      POSTGRES_HOST: db-pedidos
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
      POSTGRES_USER: ${POSTGRES_USER:-pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en el archivo .env}
      # Clave para cambiar estados
      OPERADOR_CLAVE: ${OPERADOR_CLAVE:-}
    depends_on:
      rutas:
        condition: service_started
      clima:
        condition: service_started
      recomendar:
        condition: service_started
      db-pedidos:
        condition: service_healthy
    restart: on-failure

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"          # la ÚNICA puerta hacia afuera
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - pedidos
      - recomendar
      - rutas
      - clima

volumes:
  datos-pedidos:
