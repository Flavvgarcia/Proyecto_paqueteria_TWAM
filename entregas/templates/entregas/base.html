<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Plataforma de entregas{% endblock %}</title>
  {# CSS dentro de la página: con DEBUG=0 y gunicorn, Django no sirve archivos estáticos. #}
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2328; }
    header { background: #1f3a5f; color: #fff; padding: 14px 24px; display: flex; gap: 24px; align-items: baseline; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    header a + a { font-weight: 400; opacity: .85; }
    header small { opacity: .7; margin-left: auto; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .tarjeta { background: #fff; border: 1px solid #d8dee4; border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #c4ccd4; border-radius: 6px; font-size: 1rem; }
    .campo { margin-bottom: 14px; }
    .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .error input { border-color: #cf222e; }
    .errorlist { list-style: none; padding: 0; margin: 4px 0 0; color: #cf222e; font-size: .9rem; }
    button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eaeef2; }
    th { font-size: .85rem; color: #57606a; }
    .etiqueta { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #ddf4ff; color: #0a3069; font-size: .85rem; }
    .vacio { color: #57606a; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 20px; margin: 0; }
    dt { font-weight: 600; color: #57606a; }
    dd { margin: 0; }
    @media (max-width: 600px) { .fila { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="{% url 'panel_nuevo_pedido' %}">Plataforma de entregas</a>
    <a href="{% url 'panel_nuevo_pedido' %}">Nuevo pedido</a>
    <a href="{% url 'inicio' %}">Recomendador IA</a>
    <small>atendido por {{ copia }}</small>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
